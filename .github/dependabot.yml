version: 2

# Dependabot keeps the supply-chain surface fresh without us having to
# remember. Two ecosystems matter for this repo:
#   * github-actions — pinned by major tag (e.g. actions/checkout@v6) and
#     by toolchain-named tag (dtolnay/rust-toolchain@1.95.0). Dependabot
#     bumps those for us when upstream tags move.
#   * cargo — workspace dependencies. Grouped so a flurry of patch bumps
#     lands as a single PR instead of ten.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies
      - rust
    # Patch bumps are usually safe and noisy — group them. Minors land
    # individually so we can read the changelog before merging.
    groups:
      cargo-patch:
        update-types:
          - patch
