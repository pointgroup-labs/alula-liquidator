# docker-compose for local dev / staging.
#
# Usage:
#   1. cp .env.example .env             # then fill STELLAR_SKEY
#   2. cp config.docker.example.json config.json  # then edit
#   3. docker compose up -d --build
#
# Ports (bound to 127.0.0.1 by default — local-safe):
#   * Grafana    → http://localhost:3000   (default admin / admin)
#   * Prometheus → http://localhost:9091
#   * Keeper     → internal only (scraped via prometheus on the obs network)

services:
  keeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: alula-keeper:local
    container_name: alula-keeper
    restart: unless-stopped
    # Skey is interpolated from the .env file at compose time. The `:?` form
    # makes compose abort with a clear error if STELLAR_SKEY is missing,
    # rather than silently passing an empty string to the binary.
    command:
      - --config
      - /etc/keeper/config.json
      - --skey
      - ${STELLAR_SKEY:?STELLAR_SKEY must be set (see .env.example)}
    environment:
      RUST_LOG: ${RUST_LOG:-info,alula_keeper=info,alula_engine=info}
    volumes:
      - ./config.json:/etc/keeper/config.json:ro
      - keeper-data:/var/lib/keeper
    networks: [obs]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: alula-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks: [obs]
    depends_on:
      keeper:
        # `service_started` (not `service_healthy`) so prometheus comes up
        # even when the keeper is degraded — scrape failures show up as
        # `up == 0` in the dashboard, which is the signal we want.
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.0
    container_name: alula-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [obs]
    depends_on:
      prometheus:
        condition: service_started

networks:
  obs:
    driver: bridge

volumes:
  keeper-data:
  prometheus-data:
  grafana-data:
