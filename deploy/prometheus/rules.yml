groups:
  - name: keeper.liveness
    interval: 30s
    rules:
      - alert: KeeperDown
        expr: up{job="alula-keeper"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Keeper scrape is down ({{ $labels.instance }})"
          description: >
            Prometheus has been unable to scrape the keeper for >1m.
            The bot is either crashed, deadlocked, or unreachable on the
            obs network. Check `docker compose logs keeper` first.

      - alert: KeeperScanStalled
        expr: time() - liquidator_last_successful_scan_timestamp_seconds > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Keeper has not completed a scan in >5m"
          description: >
            `liquidator_last_successful_scan_timestamp_seconds` has not
            advanced. Process is alive (scrape works) but the scan loop is
            stuck — typically RPC timeouts or the SQLite mutex blocked by a
            long write. Inspect logs for repeated `get_events` failures.

  - name: keeper.backpressure
    interval: 30s
    rules:
      - alert: KeeperEventsDropped
        expr: rate(engine_strategy_lagged_events_total[5m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Strategy stage is dropping events"
          description: >
            The reactor's broadcast channel to the strategy stage has lagged,
            meaning events were silently dropped. Liquidation opportunities
            may have been missed. Raise the channel capacity or speed up the
            strategy.

      - alert: KeeperActionsDropped
        expr: rate(engine_executor_lagged_actions_total[5m]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Executor stage is dropping actions"
          description: >
            Actions produced by strategies are being dropped before they can
            be submitted. Capital may be committed in the ledger but the tx
            never built. Investigate executor throughput.

      - alert: KeeperCollectorLagging
        expr: rate(keeper_collector_lagged_events_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Collector {{ $labels.collector }} is lagging"
          description: >
            A collector's outbound channel is dropping events to the reactor.
            Distinct from the strategy/executor lag alerts because this is
            upstream of `engine_*_lagged_*_total`.

  - name: keeper.execution
    interval: 30s
    rules:
      - alert: KeeperOpportunitiesNotDispatched
        expr: |
          liquidator_liquidatable_positions > 0
          and on() rate(liquidator_liquidation_plans_dispatched_total[10m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Liquidatable positions exist but nothing is dispatched"
          description: >
            The strategy is observing actionable opportunities but no plans
            have been sent in 10 min. Either every opportunity is being
            skipped (check `liquidator_skip_total` by reason) or a downstream
            stage is wedged. This is the money-leaving alert — page.

      - alert: KeeperTxConfirmationRateLow
        expr: |
          (rate(keeper_tx_confirmed_total[15m]) /
           clamp_min(rate(keeper_tx_submitted_total[15m]), 1e-9)) < 0.5
          and rate(keeper_tx_submitted_total[15m]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "<50% of submitted txs confirmed (15m)"
          description: >
            The keeper is submitting transactions that the network is not
            confirming. Likely fee underpayment, sequence contention, or
            simulation/runtime drift. Check XLM balance against
            `xlm_safety_margin` and review `keeper_tx_bad_seq_retries_total`.

      - alert: KeeperBadSeqRetriesElevated
        expr: rate(keeper_tx_bad_seq_retries_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Frequent tx_bad_seq retries"
          description: >
            The local sequence-number cursor is repeatedly racing the RPC's
            view. >6 retries/minute sustained suggests parallel submitters
            against the same source account or a stuck in-flight tx.

  - name: keeper.funding
    interval: 30s
    rules:
      - alert: KeeperXlmFundingLow
        expr: |
          liquidator_xlm_balance_stroops
          < liquidator_xlm_safety_margin_stroops * 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "XLM balance within 2x of safety margin"
          description: >
            The keeper's XLM balance is approaching the configured
            `xlm_safety_margin`. Below the margin the rebalancer and
            liquidator refuse to spend XLM to preserve inclusion-fee
            headroom, so liquidation opportunities will start being
            skipped. Refill the keeper account.

      - alert: KeeperXlmFundingCritical
        expr: |
          liquidator_xlm_balance_stroops
          < liquidator_xlm_safety_margin_stroops * 1.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "XLM balance at safety margin — keeper is freezing"
          description: >
            The keeper's XLM balance is within 10% of the configured
            `xlm_safety_margin`. The next opportunity will be skipped
            with `insufficient_capital`. Refill immediately.

  - name: keeper.persistence
    interval: 30s
    rules:
      - alert: KeeperCursorSaveFailing
        expr: rate(keeper_cursor_save_failures_total[10m]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Event cursor not being persisted"
          description: >
            Soroban event cursor writes to SQLite are failing. On restart the
            keeper will replay events from the last successful save (or from
            head), potentially missing or duplicating work. Check db_path
            mount and disk space.

  - name: prometheus.meta
    interval: 60s
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"
          description: >
            A scrape target has been unreachable for >5m. If this is
            `alula-keeper`, the more specific `KeeperDown` alert should also
            be firing.

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager itself is down"
          description: >
            Alertmanager is unreachable. Other alerts may be firing in
            Prometheus but cannot be delivered.
