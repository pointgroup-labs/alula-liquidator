global:
  # 10s scrape keeps alert lag tight for a trading bot.
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    stack: alula-liquidator

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: alula-keeper
    metrics_path: /metrics
    static_configs:
      - targets: ['keeper:9000']
        labels:
          service: keeper

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
