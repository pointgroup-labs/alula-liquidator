global:
  # 10s scrape keeps alert lag tight for a trading bot.
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    stack: alula-liquidator

scrape_configs:
  - job_name: alula-keeper
    metrics_path: /metrics
    static_configs:
      - targets: ['keeper:9090']
        labels:
          service: keeper
