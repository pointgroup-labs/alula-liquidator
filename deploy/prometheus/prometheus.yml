# Prometheus scrape config for the alula-liquidator stack.
#
# The keeper exposes /metrics on port 9090 on the `obs` bridge network. We
# scrape it every 10s (vs the upstream 15s default) to keep alert lag tight
# for a trading bot. external_labels propagate to alerting/remote-write so
# multi-stack deployments stay distinguishable.

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    stack: alula-liquidator

scrape_configs:
  - job_name: alula-keeper
    metrics_path: /metrics
    static_configs:
      - targets: ['keeper:9090']
        labels:
          service: keeper
