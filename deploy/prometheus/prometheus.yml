global:
  # 10s scrape keeps alert lag tight for a trading bot.
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    stack: alula-liquidator

# Alerting is owned by Grafana (Grafana-managed rules provisioned under
# deploy/grafana/provisioning/alerting/). Prometheus is a pure TSDB here.

scrape_configs:
  - job_name: alula-keeper
    metrics_path: /metrics
    static_configs:
      - targets: ['keeper:9000']
        labels:
          service: keeper

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
