global:
  resolve_timeout: 5m

route:
  # Default tree. Wire up a real integration in the `default` receiver
  # below before relying on alert delivery — this config ships with a
  # no-op receiver so the container starts cleanly.
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: default
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: default
      repeat_interval: 12h

inhibit_rules:
  # If the keeper itself is down, suppress every more-specific keeper alert —
  # they're all downstream of liveness and would just spam.
  - source_matchers:
      - alertname = "KeeperDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ['service']

receivers:
  - name: default
    # No-op receiver: alerts fire and group correctly but go nowhere.
    # Add a `webhook_configs:`, `slack_configs:`, or similar block here
    # to deliver. Env-var expansion is not used because the v0.32.1
    # alertmanager binary no longer supports --config.expand-env;
    # render this file with `envsubst` at deploy time if you need
    # secrets out of the repo.
