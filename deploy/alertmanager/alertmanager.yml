global:
  resolve_timeout: 5m

route:
  # Default tree. Operators override the receiver via env-templated webhook
  # URL — see the `webhook` receiver below.
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: default
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: default
      repeat_interval: 12h

inhibit_rules:
  # If the keeper itself is down, suppress every more-specific keeper alert —
  # they're all downstream of liveness and would just spam.
  - source_matchers:
      - alertname = "KeeperDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ['service']

receivers:
  - name: default
    # Replace with your own integration. The webhook URL is read from the
    # ALERTMANAGER_WEBHOOK_URL env var inside the alertmanager container so
    # the URL never lands in the repo. Set it via deploy/keeper.env or a
    # dedicated alertmanager.env file (see docker-compose.yml).
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL}'
        send_resolved: true
