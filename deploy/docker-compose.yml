name: alula-liquidator

networks:
  obs:
    driver: bridge

volumes:
  keeper-data:
  prom-data:
  grafana-data:
  traefik-acme:

services:
  keeper:
    image: ghcr.io/pointgroup-labs/alula-keeper:main
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --config
      - /etc/keeper/config.toml
      - --skey
      - ${STELLAR_SKEY:?STELLAR_SKEY must be set in .env}
    environment:
      RUST_LOG: info
    volumes:
      - ./config/keeper/config.toml:/etc/keeper/config.toml:ro
      - keeper-data:/var/lib/keeper
    ports:
      - "127.0.0.1:9000:9000"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - obs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - obs

  grafana:
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://stats.alula.finance/"
      GF_SERVER_DOMAIN: "stats.alula.finance"
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [obs]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`stats.alula.finance`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      prometheus:
        condition: service_started

  traefik:
    image: traefik:v3.7.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=alula-liquidator_obs
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:admin@alula.finance}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80/tcp" # http
      - "443:443/tcp" # https
      - "443:443/udp" # https http3 quic
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks:
      - obs

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.docker/config.json:/config.json:ro
    command:
      - --label-enable
      - --interval
      - "60"
      - --cleanup
      - --rolling-restart
    networks:
      - obs
