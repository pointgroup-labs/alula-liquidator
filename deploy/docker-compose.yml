name: alula-liquidator

networks:
  obs:
    driver: bridge

volumes:
  keeper-data:
  prom-data:
  alertmanager-data:
  grafana-data:

services:
  keeper:
    image: ghcr.io/pointgroup-labs/alula-keeper:main
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --config
      - /etc/keeper/config.json
      - --skey
      - ${STELLAR_SKEY:?STELLAR_SKEY must be set in .env}
    environment:
      RUST_LOG: info
    volumes:
      - ./config/keeper.json:/etc/keeper/config.json:ro
      - keeper-data:/var/lib/keeper
    ports:
      - "127.0.0.1:9000:9000"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - obs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - obs

  alertmanager:
    image: prom/alertmanager:v0.32.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - obs

  grafana:
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [obs]
    depends_on:
      prometheus:
        condition: service_started

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.docker/config.json:/config.json:ro
    command:
      - --label-enable
      - --interval
      - "60"
      - --cleanup
      - --rolling-restart
    networks:
      - obs
