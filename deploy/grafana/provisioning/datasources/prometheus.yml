apiVersion: 1

# Pinned UIDs so dashboard JSON references survive volume rebuilds.
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      # Speaks the same /api/v2 contract the prom/alertmanager image serves.
      implementation: prometheus
      handleGrafanaManagedAlerts: false
