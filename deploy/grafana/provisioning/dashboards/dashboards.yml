apiVersion: 1

providers:
  - name: alula
    orgId: 1
    folder: ''
    type: file
    # Default `false`: when a JSON file is removed from disk, Grafana also
    # removes the dashboard from its DB. Setting this to true would *keep*
    # stale DB entries after file deletion — usually not what we want.
    disableDeletion: false
    updateIntervalSeconds: 30
    # Permit in-UI edits for iterative tuning; re-export to JSON to persist.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
