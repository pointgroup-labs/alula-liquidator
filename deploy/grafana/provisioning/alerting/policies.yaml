apiVersion: 1

# Root notification policy. Severity-based repeat intervals mirror the former
# alertmanager.yml routing: critical pages fast and repeats hourly; warnings
# repeat every 12h. All routes point at the `default` contact point.
policies:
  - orgId: 1
    receiver: default
    group_by: ['grafana_folder', 'alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: default
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 10s
        repeat_interval: 1h
      - receiver: default
        object_matchers:
          - ['severity', '=', 'warning']
        repeat_interval: 12h
