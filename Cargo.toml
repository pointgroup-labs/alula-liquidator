[workspace]
members = [
    "cli",
    "artemis-alula",
]
resolver = "3"
package.edition = "2024"
package.version = "0.0.1"


[workspace.dependencies]
## TODO: Update 21 -> most recent
stellar-xdr = { version = "25", default-features = true, features = [] }
stellar-rpc-client = "25"
soroban-fixed-point-math = {version = "1.0.0"}
artemis-alula = { path = "./artemis-alula" }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tracing = "0.1.44"
ed25519-dalek = "2.2.0"
stellar-strkey = "0.0.16"
hex = "0.4.3"
sha2 = "0.11.0"
serde_json = "1.0.149"
rusqlite = { version = "0.39.0", features = ["bundled"] }
url = { version = "2.5.8", features = ["serde"] }

[profile.release]
panic = 'abort'

[profile.dev]
panic = 'abort'