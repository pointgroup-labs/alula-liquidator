[workspace]
members = ["engine", "keeper"]
resolver = "3"

[workspace.package]
version = "0.0.3"
edition = "2024"
authors = ["Pointgroup Team"]
repository = "https://github.com/pointgroup-labs/alula-liquidator"
readme = "./README.md"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# Stellar / Soroban
stellar-xdr = "25"
stellar-rpc-client = "25"
stellar-strkey = "0.0.16"
soroban-fixed-point-math = "1.0.0"

# Async runtime
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

# Serialization & errors
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
thiserror = "2.0"

# Crypto / hashing
ed25519-dalek = "2.2.0"
sha2 = "0.11.0"
hex = "0.4.3"

# Storage / CLI / observability
rusqlite = { version = "0.39.0", features = ["bundled"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
metrics = "0.24"
parking_lot = "0.12"
proptest = "1.11"
url = { version = "2.5.8", features = ["serde"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Trap on any raw-arithmetic overflow we haven't already wrapped in
# `checked_*` / `saturating_*`. A panic-abort here is preferable to silent
# wrapping in liquidation / profitability math.
overflow-checks = true

[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release-debug]
inherits = "release"
strip = "none"
debug = "line-tables-only"
