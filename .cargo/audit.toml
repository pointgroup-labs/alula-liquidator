# `cargo audit` / rustsec/audit-check@v2 advisory ignore list.
#
# Every entry here is a deliberate, time-limited acceptance of a finding
# we cannot fix without an upstream release. Each entry documents:
#   1. the upstream blocker that makes a SemVer-compatible bump impossible,
#   2. an honest residual-risk note for this keeper's deployment shape,
#   3. the version range in which a fix exists.
#
# Re-run `cargo audit` whenever bumping `stellar-rpc-client` or any
# `soroban-sdk*` crate; most of these will clear once those dependency
# trees move to `rustls 0.22+` and modern macro/derive crates.

[advisories]
ignore = [
    # --- Vulnerabilities -------------------------------------------------

    # RUSTSEC-2026-0104 — Reachable panic in CRL parsing.
    # Fixed in: rustls-webpki >= 0.103.13.
    # Blocker: stellar-rpc-client 25.x → jsonrpsee-http-client 0.20.x →
    # hyper-rustls 0.24.x → rustls 0.21 → rustls-webpki 0.101.x. The
    # 0.101.x line capped at 0.101.7; there is no in-range patched
    # release, so `cargo update` cannot help — the fix is gated on a
    # rustls 0.22+ bump in jsonrpsee-http-client.
    # Residual risk: the advisory text states "Applications that do not
    # use CRLs are not affected." The keeper performs no CRL parsing —
    # it acts as an HTTPS client to operator-configured Soroban RPC
    # endpoints, where rustls's default validator does not enable CRL
    # checking. The panic path is therefore not reachable from our
    # workload at all.
    "RUSTSEC-2026-0104",

    # RUSTSEC-2026-0098 — Name constraints for URI names were incorrectly
    # accepted.
    # Fixed in: rustls-webpki >= 0.103.13 (same line as 0104).
    # Blocker: identical dependency chain to 0104.
    # Residual risk: this is a real TLS certificate-validation defect.
    # "Operator-configured RPC URLs" mitigates *URL spoofing* but does
    # NOT mitigate an on-path attacker who can present a forged or
    # misissued cert whose name-constraints extension was crafted to
    # exploit the bug. The accepted risk here is that (a) a fix-capable
    # upgrade is not yet available within our SemVer range, (b) the
    # specific defect requires the legitimate CA chain to issue certs
    # using URI-name constraints — uncommon for the public CAs that
    # front Stellar RPC providers — and (c) production keepers run on
    # operator-controlled networks where active MITM additionally
    # requires a network-layer compromise. We accept this temporarily;
    # re-evaluate on every dependabot bump of `stellar-rpc-client`.
    "RUSTSEC-2026-0098",

    # RUSTSEC-2026-0099 — Name constraints accepted for certificates
    # asserting a wildcard name.
    # Fixed in: rustls-webpki >= 0.103.13.
    # Blocker: identical dependency chain.
    # Residual risk: same shape as 0098 — a real cert-validation bug
    # with the same MITM threat model. Same accept-temporarily rationale.
    "RUSTSEC-2026-0099",

    # --- Unmaintained ---------------------------------------------------

    # RUSTSEC-2024-0388 — `derivative` unmaintained.
    # Blocker: transitive of soroban-env-host / soroban-sdk 23.x.
    # Pure proc-macro; no runtime CVE attached. Informational.
    "RUSTSEC-2024-0388",

    # RUSTSEC-2024-0436 — `paste` no longer maintained.
    # Blocker: soroban-wasmi → soroban-env-host → soroban-sdk 23.x.
    # Pure proc-macro; no runtime CVE attached. Informational.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2025-0134 — `rustls-pemfile 1.0.x` unmaintained.
    # Blocker: hyper-rustls 0.24.x via the same stellar-rpc-client chain
    # as the rustls-webpki advisories above. Clears when that chain
    # moves to rustls 0.22+. No active CVE attached.
    "RUSTSEC-2025-0134",
]
