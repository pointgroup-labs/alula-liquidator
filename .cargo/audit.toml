# cargo-audit configuration.
#
# Each ignored advisory documents (1) the fixed-version range from the advisory,
# (2) the upstream blocker preventing the bump, and (3) an honest residual-risk
# note. Do NOT add a new ignore without all three.
#
# Re-evaluate the whole list on every `stellar-rpc-client` / `soroban-sdk`
# dependabot bump — every entry here clears once the RPC client's transitive
# rustls moves off the 0.21 line (rustls-webpki 0.101) to 0.103+.

[advisories]
ignore = [
    # RUSTSEC-2026-0104 — rustls-webpki 0.101.7: reachable panic while parsing a
    # certificate revocation list.
    # (1) Fixed in >=0.103.13 (or >=0.104.0-alpha.7).
    # (2) Pulled transitively via stellar-rpc-client -> jsonrpsee 0.20 ->
    #     rustls 0.21 -> rustls-webpki 0.101; cannot bump without the RPC client
    #     moving off the 0.21 rustls line.
    # (3) The keeper never parses caller-supplied CRLs — it only opens outbound
    #     TLS to its own configured RPC endpoint, so the panic path is
    #     unreachable in practice.
    "RUSTSEC-2026-0104",

    # RUSTSEC-2026-0098 — rustls-webpki 0.101.7: name constraints for URI names
    # were incorrectly accepted.
    # (1) Fixed in >=0.103.12 (or >=0.104.0-alpha.6).
    # (2) Same transitive blocker as RUSTSEC-2026-0104 (jsonrpsee 0.20 rustls stack).
    # (3) A name-constraint bypass only matters when validating certificates
    #     against a constrained CA; the keeper's outbound RPC TLS targets a known,
    #     operator-configured host, not a constrained-CA trust path.
    "RUSTSEC-2026-0098",

    # RUSTSEC-2026-0099 — rustls-webpki 0.101.7: name constraints were accepted
    # for certificates asserting a wildcard name.
    # (1) Fixed in >=0.103.12 (or >=0.104.0-alpha.6).
    # (2) Same transitive blocker as RUSTSEC-2026-0104.
    # (3) Same residual-risk profile as RUSTSEC-2026-0098 — no constrained-CA
    #     validation path is exercised by the keeper.
    "RUSTSEC-2026-0099",
]
